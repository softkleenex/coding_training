name: Auto Format Coding Problems

on:
  push:
    branches:
      - main
    paths:
      - 'content/백준/**/README.md'
      - 'content/atcoder/**/README.md'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Formatter Script
        run: |
          python scripts/format_problems.py
          python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-format problem READMEs [skip ci]"
            git push
          fi
